name: gokulam_app
description: Gokulam Traders - Hardware, Electrical & Plumbing Store Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  mobile_scanner: ^6.0.6
  printing: ^5.13.4
  pdf: ^3.11.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  flutter_rating_bar: ^4.0.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  carousel_slider: ^5.0.0
  path_provider: ^2.1.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  image: ^4.5.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  adaptive_icon_background: "#1B5E20"

flutter:
  uses-material-design: true
  assets:
    - assets/images/